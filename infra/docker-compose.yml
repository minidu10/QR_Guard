# QRGuard local stack. Run from this folder:  docker compose up --build
# Values come from infra/.env (copy .env.example). Defaults are for local dev only.
name: qrguard

services:
  # Local PostgreSQL with PostGIS. Same engine as Supabase, so the code works on both.
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qrguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrguard-dev-password}
      POSTGRES_DB: qrguard
    # Port on your computer. Set POSTGRES_PORT in infra/.env if 5432 is already taken.
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d qrguard']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Official minio/minio images are no longer published. pgsty/minio is a maintained
  # community build of the same MinIO server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qrguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-time job: creates the storage bucket, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qrguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
      S3_BUCKET: ${S3_BUCKET:-qrguard}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET"

  ai-service:
    build: ../apps/ai-service
    restart: unless-stopped
    environment:
      MODEL_MODE: ${MODEL_MODE:-mock}
    ports: ['8000:8000']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Local database by default. To use Supabase, set DATABASE_URL in infra/.env.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-qrguard}:${POSTGRES_PASSWORD:-qrguard-dev-password}@postgres:5432/qrguard}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-qrguard}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
      S3_BUCKET: ${S3_BUCKET:-qrguard}
      S3_FORCE_PATH_STYLE: 'true'
      AI_SERVICE_URL: http://ai-service:8000
      # Required: set these in infra/.env (see .env.example).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in infra/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in infra/.env}
      # Demo data: docker compose exec api node dist/seed/run.js
      SEED_ENABLED: 'true'
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      ai-service: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      # The browser connects here for live updates. Change it when the API has a public URL.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      # Local stack runs on plain http. Use true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
