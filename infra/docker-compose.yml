# QRGuard local stack. Run from this folder:  docker compose up --build
# Values come from infra/.env (copy .env.example). Defaults are for local dev only.
name: qrguard

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Official minio/minio images are no longer published. pgsty/minio is a maintained
  # community build of the same MinIO server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qrguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-time job: creates the storage bucket, then exits.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qrguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
      S3_BUCKET: ${S3_BUCKET:-qrguard}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET"

  ai-service:
    build: ../apps/ai-service
    restart: unless-stopped
    environment:
      MODEL_MODE: ${MODEL_MODE:-mock}
    ports: ['8000:8000']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MONGODB_URI: mongodb://mongo:27017/qrguard
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-qrguard}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-qrguard-dev-password}
      S3_BUCKET: ${S3_BUCKET:-qrguard}
      S3_FORCE_PATH_STYLE: 'true'
      AI_SERVICE_URL: http://ai-service:8000
    ports: ['4000:4000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      ai-service: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  minio-data:
